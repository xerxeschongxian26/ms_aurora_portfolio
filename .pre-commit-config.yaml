repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix] # allows ruff to auto-fix the code
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
    # strips notebook outputs and other metadata to reducd bloat
      - id: nbstripout 

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    # detects high-entropy strings (highly randomised strings)
    # that resemble keys and passwords and prevents commits
    # unless permitted
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
