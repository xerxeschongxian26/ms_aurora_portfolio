# 2022 hole-aware year-spread splice (download / local store).
# splice_path: where this campaign is written (zarr directory).
# copy_hres_t0_splice rmtree's this path, then rewrites it.
#
# Inits are an explicit 00/12 UTC list, not a regular stride. A 300 h grid
# cannot skip the z850 holes in configs/hres_t0_outsample_holes.csv.
#
# Rule (frozen here): earliest remaining 2022 00/12 init whose {t−6h, t, and
# 40 leads} contain no catalogue hole, at least 168 h after the previous pick.
# Starts at 2022-01-01T12. n=30, quarters 5/9/8/8. Windows overlap, so
# needed_times is 1022 stamps (not 30 × 42): 2022-01-01T06 → 2023-01-08T00.
#
# Keep this `inits` list identical to configs/hres_t0_2022_spread_rollout.toml.
#
# Written by scripts/toy_hres_t0_splice.py --tag <tag>:
#   data/splice_hres_t0_2022_spread.zarr/   (WB2-layout zarr; rmtree then rewrite)
#   outputs/<tag>/toy_hres_t0_splice.log   (same INFO lines as stdout)

splice_path = "data/splice_hres_t0_2022_spread.zarr"

n_rollout_steps = 40

