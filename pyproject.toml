[project]
name = "ms_aurora_portfolio"
version = "0.1.0"
description = "Machine learning portfolio project for MS Aurora"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.11.0",
    "numpy>=2.4.0",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.0",
    "pyyaml>=6.0.0",
    "microsoft-aurora>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "mypy>=1.20.0",
    "pre-commit>=4.6.0",
    "nbstripout>=0.9.0",
    "detect-secrets>=1.5.0",
    "ipykernel>=7.0.0",
    "jupyter>=1.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
