[project]
name = "aurora-inference"
version = "0.1.0"
description = "Self hosted Aurora inference service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.11.0",
    "microsoft-aurora==1.8.0",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "mypy>=1.20.0",
    "pre-commit>=4.6.0",
    "pandas-stubs>=2.2.0",
    "zarr>=3.2.1",
    "gcsfs>=2026.6.0",
    "xarray>=2025.1.0",
]
notebooks = [
    "numpy>=2.4.0",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.0",
    "pyyaml>=6.0.0",
    "zarr>=3.2.1",
    "fsspec>=2026.6.0",
    "gcsfs>=2026.6.0",
    "earthkit>=1.0.0",
    "pre-commit>=4.6.0",
    "nbstripout>=0.9.0",
    "detect-secrets>=1.5.0",
    "ipykernel>=7.0.0",
    "jupyter>=1.1.0",
    "weatherbench2",
]

# This extra dependency is for real_forecast.py / eval_rmse.py / GPU image
# - also includes the packages from viz via self referencing "aurora-inference[viz]"
# - xarray is required by evaluation.metrics / eval_rmse (not only the dev extra)
forecast = [
    "zarr>=3.2.1",
    "gcsfs>=2026.6.0",
    "aurora-inference[viz]",
    "pandas",
    "xarray>=2025.1.0",
]

# WP5 quick-look map only. Not imported by src/; install with: uv sync --extra viz
viz = [
    "matplotlib>=3.10.0",
    "cartopy>=0.24.0",
]

[tool.uv]
package = true

[tool.uv.sources]
weatherbench2 = { git = "https://github.com/google-research/weatherbench2.git" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["aurora.*", "microsoft_aurora.*", "gcsfs.*", "gcsfs", "zarr.*", "zarr", "xarray.*", "xarray"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that download checkpoints or run model forward passes",
]
addopts = "-m 'not slow'"
